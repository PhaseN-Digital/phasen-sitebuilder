<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' preview: data: blob:; frame-src preview:; style-src 'self' 'unsafe-inline'">
<title>PhaseN Site Builder</title>
<link rel="stylesheet" href="../node_modules/quill/dist/quill.snow.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="logo-wide.png" alt="PhaseN Digital"><span>Site Builder</span></div>
  <h2>Your websites</h2>
  <nav id="site-list"></nav>
  <form id="new-site" class="new-site">
    <input name="name" placeholder="New website name" required>
    <button class="primary">Create website</button>
  </form>
  <button id="import-wp" class="import-button">Import a website…</button>
  <button id="open-themes" class="import-button">Themes…</button>
  <button id="open-settings" class="import-button">Settings</button>
</aside>
<main id="main">
  <div class="welcome">
    <h1>Welcome</h1>
    <p>Create a website on the left to get started. You can change everything later.</p>
  </div>
</main>
<script src="../node_modules/quill/dist/quill.js"></script>
<script src="../lib/layouts.js"></script>
<script src="app.js"></script>
<script src="copied.js"></script>
<script src="wordpress.js"></script>
<script src="theme-builder.js"></script>
<script src="settings.js"></script>
</body>
</html>
