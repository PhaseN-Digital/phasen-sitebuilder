name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Picks up a release PR an earlier gate left with the `regate` label (#111),
  # so a refusal that only meant "too early" doesn't strand it. Cheap when
  # there's nothing to do: release-please plus one API call.
  schedule:
    - cron: "17 6 * * *" # daily: every run bills at least a minute on this private repo

permissions:
  contents: write
  pull-requests: write
  issues: write # labels and comments on the release PR

# One run at a time: the gate merges and releases, and must not interleave
# with another run updating the same release PR. Never cancel in progress: a
# push that lands mid-run queues the next run, and the gate below refuses to
# merge onto the moved main and leaves the PR to that run (#97).
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
      pr_branch: ${{ steps.pr.outputs.branch }}
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      # main as this run found it, before release-please builds the PR on it.
      # The gate only merges if main is still exactly this (#97).
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # For scripts/release-bump.js and `git ls-remote origin`.
      - uses: actions/checkout@v7
      # Which release PR to gate, if any (scripts/release-bump.js gate): one
      # release-please opened or updated in this run (prs_created), any open
      # one on a manual dispatch on main, or one an earlier gate labelled
      # `regate`. The head comes from the branch ref, read after release-please
      # has finished: the PR API lags a ref update by seconds, and reading it
      # tested the previous head (#111).
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          START_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          read -r number branch LABELS < <(gh pr list --state open --label "autorelease: pending" --json number,headRefName,labels \
            -q '.[0] | select(.) | "\(.number) \(.headRefName) \([.labels[].name] | join(","))"') || true
          [ -n "$number" ] || { echo "No open release PR"; exit 0; }
          export LABELS
          why=$(node scripts/release-bump.js gate)
          [ -n "$why" ] || { echo "Release PR #$number: nothing new to gate"; exit 0; }
          sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          # #113: release-please leaves its PR alone ("remained the same")
          # when only non-releasable commits (chore/docs/test) landed since
          # it built it, so the head never gets this run's main and the gate
          # would refuse it forever. Merge START_MAIN (not a later main) into
          # the branch: regression then tests that merge, and the gate's
          # checks below are unchanged. release-please force-pushes over it
          # the next time it rebuilds. A conflict (e.g. a chore touched
          # package.json) leaves the head behind, labelled regate below.
          if [ "$(gh api "repos/$GH_REPO/compare/$START_MAIN...$sha" -q .behind_by)" != 0 ] &&
             merged=$(gh api -X POST "repos/$GH_REPO/merges" -f base="$branch" -f head="$START_MAIN" \
               -f commit_message="Merge main $START_MAIN into $branch (#113)" -q .sha) && [ -n "$merged" ]; then
            sha=$merged
            echo "Merged main $START_MAIN into release PR #$number: head is now $sha"
          fi
          # A head without this run's main would only be refused after
          # regression, so don't spend a regression run on it; the label
          # brings it back once release-please has rebuilt it on main.
          if [ "$(gh api "repos/$GH_REPO/compare/$START_MAIN...$sha" -q .behind_by)" != 0 ]; then
            gh label create regate --color c5def5 --description "Release gate refused as too early; the next run re-gates it" --force
            gh pr edit "$number" --add-label regate
            echo "Release PR #$number at $sha isn't based on main $START_MAIN yet; left labelled regate"
            exit 0
          fi
          echo "Gating release PR #$number ($branch) at $sha: $why"
          { echo "number=$number"; echo "branch=$branch"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  # Release gate (#47): the regression suite runs against the release PR's
  # head. Patch releases that pass are merged here and released by the
  # `release` job below; minor/major releases wait for the maintainer to merge
  # them. This has to happen in this run: release-please's PR updates and a
  # GITHUB_TOKEN merge don't trigger other workflow runs.
  regression:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_sha != '' }}
    uses: ./.github/workflows/regression.yml
    with:
      ref: ${{ needs.release-please.outputs.pr_sha }}

  release-gate:
    needs: [release-please, regression]
    if: ${{ !cancelled() && needs.release-please.outputs.pr_sha != '' }}
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.release-please.outputs.pr_number }}
      SHA: ${{ needs.release-please.outputs.pr_sha }}
      BRANCH: ${{ needs.release-please.outputs.pr_branch }}
      START_MAIN: ${{ needs.release-please.outputs.main_sha }}
      RESULT: ${{ needs.regression.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Everything below is re-read right before merging, not taken from the
      # start of the run: regression takes minutes and main can move (#97).
      - id: gate
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git fetch -q origin main "$SHA"
          # A refusal that only means "too early" labels the PR `regate`, so
          # the next run of any kind (push, the daily schedule, a dispatch)
          # re-gates it even if nothing new is pushed (#111).
          regate() {
            gh label create regate --color c5def5 --description "Release gate refused as too early; the next run re-gates it" --force
            gh pr edit "$PR" --add-label regate
            gh pr comment "$PR" --body "Not merging: $1 ([run]($run)). Labelled \`regate\`: the next run re-gates this PR (or now: \`gh workflow run release-please.yml\`)."
          }
          # The head from the ref, like the release-please job (#111).
          PR_HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          BASE=$(gh pr view "$PR" --json baseRefOid -q .baseRefOid)
          git fetch -q origin "$PR_HEAD"
          export PR_HEAD BASE TESTED="$SHA" MAIN=$(git rev-parse origin/main)
          export CONTAINS_MAIN=$(git merge-base --is-ancestor "$MAIN" "$SHA" && echo true || echo false)
          stale=$(node scripts/release-bump.js stale)
          if [ -n "$stale" ]; then
            regate "$stale"
            exit 0
          fi
          # From here on the gate reaches a verdict on this head.
          gh pr edit "$PR" --remove-label regate 2>/dev/null || true
          if [ "$RESULT" != success ]; then
            gh label create regression-failed --color d73a4a --description "Release PR failed the regression suite" --force
            gh pr edit "$PR" --add-label regression-failed
            gh pr comment "$PR" --body "Regression suite result: **$RESULT** on $SHA ([run]($run)). Not merging."
            exit 0
          fi
          gh pr edit "$PR" --remove-label regression-failed 2>/dev/null || true
          # Classified from the versions now on main and the PR head, so a
          # patch decision can't outlive a feat landing on main.
          BUMP=$(node scripts/release-bump.js "$(git show origin/main:.release-please-manifest.json | jq -r '."."')" "$(git show "$PR_HEAD:.release-please-manifest.json" | jq -r '."."')")
          if [ "$BUMP" != patch ]; then
            gh label create needs-approval --color fbca04 --description "Minor/major release: the maintainer merges it" --force
            gh pr edit "$PR" --add-label needs-approval
            gh pr comment "$PR" --body "Regression suite passed on $SHA ([run]($run)). This is a **$BUMP** release, so it waits for the maintainer to merge it."
            exit 0
          fi
          # Last look at main right before merging; --match-head-commit pins the
          # head, this pins the base.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$MAIN" ]; then
            regate "main moved after the gate checked it"
            exit 0
          fi
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
          # GitHub has no compare-and-swap on the base, so a push in the second
          # between the check above and the merge is caught here: the squash must
          # be exactly the tested tree. If not, fail loudly and don't release.
          merged=$(gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)
          git fetch -q origin "$merged"
          if [ "$(git rev-parse "$merged^{tree}")" != "$(git rev-parse "$SHA^{tree}")" ]; then
            gh pr comment "$PR" --body "**Merged onto a main that moved during the merge**, so $merged isn't what regression tested ([run]($run)). Not releasing from this run; the maintainer must check the next release."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

  # Creates the release for a patch PR the gate just merged (the merge's push
  # to main doesn't start a new run, see above).
  release:
    needs: release-gate
    if: ${{ needs.release-gate.outputs.merged == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Installers are built here rather than in an `on: release`/tag workflow:
  # release-please tags with GITHUB_TOKEN, and GitHub doesn't let that token's
  # events trigger other workflows, so such a workflow would never run.
  # Each OS builds its own installer: wrangler's esbuild/workerd binaries are
  # platform-specific npm optional deps, so they can't be cross-built.
  # That includes CPU arch: macos-latest is Apple Silicon (arm64 dmg) and
  # macos-15-intel is Intel (x64 dmg); electron-builder builds for the host arch.
  # ubuntu-latest builds the Linux x64 AppImage and .deb (#153).
  # A manual dispatch builds installers as run artifacts without a release.
  # The release comes from either release-please run: a maintainer-merged
  # release PR (first job) or a patch the gate merged (`release`).
  build:
    needs: [release-please, release]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && (needs.release-please.outputs.release_created == 'true' || needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || needs.release.outputs.tag_name }}
    steps:
      # Build the tag: after a gate merge, github.sha is still the pre-release commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # GitHub sign-in (#60): the OAuth App's client ID is public by design
      # (device flow, no client secret), so it's a repository variable, written
      # where lib/github.js reads it. Without one the app says sign-in isn't configured.
      - name: GitHub sign-in config
        env:
          SITEBUILDER_GITHUB_CLIENT_ID: ${{ vars.SITEBUILDER_GITHUB_CLIENT_ID }}
        run: |
          [ -n "$SITEBUILDER_GITHUB_CLIENT_ID" ] || echo "::warning::SITEBUILDER_GITHUB_CLIENT_ID isn't set: GitHub sign-in will be off in these installers"
          node -e 'require("fs").writeFileSync("lib/github-config.json", JSON.stringify({ clientId: process.env.SITEBUILDER_GITHUB_CLIENT_ID || "" }) + "\n")'
      # Signing switches on by itself once the secrets exist (see README).
      # A missing secret expands to "", which electron-builder doesn't treat as
      # unset (an empty CSC_LINK is still imported on macOS), so empty ones are
      # unset here, along with the other OS's certificate: Windows falls back
      # to CSC_LINK when WIN_CSC_LINK is missing. With no certificate for this
      # OS, CSC_IDENTITY_AUTO_DISCOVERY=false keeps the build unsigned.
      # Notarisation runs when the APPLE_* vars are set too (macOS only).
      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            cert=WIN_CSC_LINK
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            cert=CSC_LINK
          fi
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "${!cert}" ]; then
            echo "No $cert secret: building unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID # can't notarise unsigned
          fi
          npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
      - name: Attach installer to the release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb --clobber

  # Public downloads and the app's update check (#37). This repo is private,
  # so its release assets aren't downloadable by users: each release's
  # installers plus a latest.json (read by lib/update.js) also go to a release
  # with the same tag in the public, releases-only repo. Only built files and
  # the release notes are copied there, never source.
  # RELEASES_TOKEN is a fine-grained token with Contents read/write on that
  # repo only. It is set on the one step that needs it and never echoed
  # (GitHub masks secrets in logs anyway).
  publish-installers:
    needs: [release-please, release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release-please.outputs.release_created == 'true' || needs.release.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || needs.release.outputs.tag_name }}
      PUBLIC_REPO: PhaseN-Digital/phasen-sitebuilder-releases
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      # Same names GitHub gives the private release's assets (spaces become
      # dots), so the URLs in latest.json are exactly what gets uploaded. ls
      # fails the job if an installer is missing rather than publishing a
      # latest.json that points nowhere.
      - name: Write latest.json and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          for f in *' '*; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          exe=$(ls *.exe)
          arm=$(ls *-arm64.dmg)
          x64=$(ls *-x64.dmg)
          linux=$(ls *.AppImage) # the .deb is published too, but the banner links the AppImage
          base="https://github.com/$PUBLIC_REPO/releases/download/$TAG"
          jq -n --arg version "${TAG##*-v}" --arg notes "https://github.com/$PUBLIC_REPO/releases/tag/$TAG" \
            --arg win "$base/$exe" --arg arm "$base/$arm" --arg x64 "$base/$x64" --arg linux "$base/$linux" \
            '{version: $version, notes: $notes, downloads: {"win32-x64": $win, "darwin-arm64": $arm, "darwin-x64": $x64, "linux-x64": $linux}}' > latest.json
          cat latest.json
          # The changelog section for this version, from the private release.
          gh release view "$TAG" --json body -q .body > ../notes.md
      # Created with its files in one go (gh publishes it once they're up), so
      # releases/latest/download/latest.json never points at a release without
      # installers. On a rerun the release exists, so the files are replaced.
      - name: Publish to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$PUBLIC_REPO" dist/* --clobber
          else
            gh release create "$TAG" -R "$PUBLIC_REPO" dist/* --title "PhaseN Site Builder ${TAG##*-v}" --notes-file notes.md --latest
          fi
