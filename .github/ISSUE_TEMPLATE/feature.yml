name: Feature request
description: Suggest something new or a change to how the app works.
labels: [enhancement]
projects: ["PhaseN-Digital/3"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who hits it and when. Describe the need rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
  - type: textarea
    id: notes
    attributes:
      label: Anything else
